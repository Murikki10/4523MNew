<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Lab 1.1a</title>
<script>
    function load(){
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(55, 55);
        ctx.lineTo(5, 105);
        ctx.lineTo(5, 5);
        ctx.lineTo(55, 55);

        ctx.moveTo(205, 55);
        ctx.arc(155, 55, 50, 0*Math.PI, 2*Math.PI);
        ctx.stroke();
    }
</script>
</head>
<html>
    <body onload="load();">
        <canvas id="canvas" width="300" height="300">
        </canvas>
    </body>
</html>
