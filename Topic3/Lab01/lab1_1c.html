<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab1.1c</title>
    <script>
        function load(){
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.moveTo(55, 55);
            ctx.lineTo(5, 105);
            ctx.lineTo(5, 5);
            ctx.lineTo(55, 55);
            ctx.fillStyle="pink";
            ctx.strokeStyle="red";
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(155, 55, 50, 0*Math.PI, 2*Math.PI);
            ctx.strokeStyle="blue";
            ctx.fillStyle="lightblue";
            ctx.fill();
            ctx.stroke();
        }
    </script>
</head>
<body onload="load()">
    <canvas id="canvas" width="300" height="300">
    </canvas>
</body>
</html>
